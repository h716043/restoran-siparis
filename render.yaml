services:
  - type: web
    name: restoran-whatsapp-bridge
    runtime: node
    plan: free
    buildCommand: npm install --no-save @whiskeysockets/baileys qrcode-terminal pino
    startCommand: node whatsapp-bridge.mjs
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
